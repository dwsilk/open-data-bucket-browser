name: Deploy

on:
  push:
    branches: [main]
  # The index is a snapshot of the registry and of bucket access. A weekly
  # rebuild picks up new datasets and CORS changes with no code change.
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The probe presents the deployed origin, so a bucket that allows only
      # named origins is judged as the live page will meet it.
      - run: npm run index
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
