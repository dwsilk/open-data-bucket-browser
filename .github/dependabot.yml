version: 2

# Weekly, with a cooldown: a release must be 15 days old before a version
# update proposes it, so a compromised or broken release has time to be
# caught and pulled first. Security updates skip the cooldown and the groups,
# and arrive on their own as soon as they are published.
#
# Groups keep the review load to a few PRs a week. A package goes into the
# first group that matches it. The named groups hold packages that must move
# together, majors included; the last group collects every other minor and
# patch update. A major outside the named groups gets a PR of its own.

updates:
  - package-ecosystem: npm
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: chore(deps)
    groups:
      primer:
        patterns:
          - '@primer/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-is'
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
      # Vitest and its plugins depend on a Vite major.
      vite:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
      # ESLint plugins and configs follow the ESLint major.
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-*'
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
